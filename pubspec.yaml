name: cryptowise
description: CryptoWise - Cryptocurrency Investment App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  smooth_page_indicator: ^1.1.0
  google_fonts: ^6.1.0
  http: ^1.2.1
  fl_chart: ^0.68.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.0.7
  image_picker: ^1.1.2

  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png
    - assets/images/wallet.png
    - assets/images/profile.png
